<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ArhinD RC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #2b2b2b, #080808);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 420px;
      padding: 32px 20px;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.25);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 32px;
      color: #bdbdbd;
      font-size: 15px;
    }

    h2 {
      margin: 28px 0 14px;
      font-size: 20px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 14px 18px;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: 0.2s;
    }

    .links a:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>

<body>
  <main class="page">
    <img class="avatar" src="https://github.com/ArhinDRC.png" alt="ArhinD RC">

    <h1>ArhinD RC</h1>
    <p class="subtitle">Мои проекты, соцсети и полезные ссылки</p>

    <h2>Связь</h2>
    <div class="links">
      <a href="https://t.me/your_username" target="_blank">Telegram</a>
      <a href="https://www.tiktok.com/@your_username" target="_blank">TikTok</a>
      <a href="mailto:arhindrc@gmail.com">Email</a>
    </div>

    <h2>Проекты</h2>
    <div class="links">
      <a href="https://github.com/ArhinDRC" target="_blank">GitHub</a>
      <a href="https://example.com" target="_blank">Мой проект</a>
      <a href="https://open.spotify.com/" target="_blank">Spotify</a>
    </div>
  </main>
</body>
</html>
