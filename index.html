<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ArhinD RC</title>
  <meta name="description" content="Personal links website by ArhinD RC">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0.75)
        ),
        url("background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.10), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.08), transparent 35%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin-left: 7%;
      padding: 32px 20px;
      text-align: center;
    }

    .card {
      padding: 30px;
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.50);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.60);
      backdrop-filter: blur(14px);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.35);
      margin-bottom: 16px;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.18);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #d7d7d7;
      font-size: 15px;
      line-height: 1.5;
    }

    h2 {
      margin: 28px 0 14px;
      font-size: 20px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 14px 18px;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: 0.25s ease;
    }

    .links a:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.20);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.40);
    }

    .spotify-box {
      margin-top: 12px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.38);
    }

    .footer {
      margin-top: 26px;
      color: #bdbdbd;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      body {
        justify-content: center;
        background-position: center;
      }

      .page {
        margin-left: 0;
        padding: 24px 16px;
      }

      .card {
        padding: 24px 18px;
      }

      h1 {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <img class="avatar" src="https://github.com/ArhinDRC.png" alt="ArhinD RC">

      <h1>ArhinD RC</h1>
      <p class="subtitle">
        My personal link page with projects, social media and music playlist.
      </p>

      <h2>Связь</h2>
      <div class="links">
        <a href="https://t.me/Da8Rc9l" target="_blank" rel="noopener noreferrer">
          Telegram
        </a>

        <a href="https://x.com/ArhinDrk" target="_blank" rel="noopener noreferrer">
          Twitter / X
        </a>

        <a href="https://dtf.ru/id2870193" target="_blank" rel="noopener noreferrer">
          DTF
        </a>
      </div>

      <h2>Проекты</h2>
      <div class="links">
        <a href="https://github.com/ArhinDRC" target="_blank" rel="noopener noreferrer">
          GitHub
        </a>

        <a href="https://open.spotify.com/playlist/3segHkxwZrY4LY9MrjF6bu?si=shA2J1yRQXiftuHLZvQHAg" target="_blank" rel="noopener noreferrer">
          Spotify Playlist
        </a>
      </div>

      <h2>Сейчас слушаю</h2>
      <div class="spotify-box">
        <iframe
          style="border-radius: 18px;"
          src="https://open.spotify.com/embed/playlist/3segHkxwZrY4LY9MrjF6bu?utm_source=generator&theme=0"
          width="100%"
          height="152"
          frameborder="0"
          allowfullscreen=""
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>

      <p class="footer">
        made with 🖤 by ArhinD RC
      </p>
    </section>
  </main>
</body>
</html>
